name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-24.04
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-analysis.txt
      - run: python scripts/validate_repository.py
      - run: python scripts/inspect_datasets.py
      - run: python scripts/multivariate_regression.py
      - run: python scripts/make_figures.py --no-model
